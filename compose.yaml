services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-career}
      POSTGRES_USER: ${POSTGRES_USER:-career}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set password}
      TZ: Asia/Seoul
    ports: ['127.0.0.1:15408:5432']
    volumes:
      - dev-career-portfolio-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped
  api:
    # Tagged by commit on the server, so a rollback starts the earlier image (deploy/remote-deploy.sh).
    image: career-backend:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: backend/Dockerfile, secrets: [npm_token] }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-career}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-career}
      PORT: 3108
      # Bind every interface inside the container; the host publishes the port on 127.0.0.1 only.
      HOST: 0.0.0.0
      TZ: Asia/Seoul
      # #106: the shared sign-in (sirloinbh/shared-auth) checks each /api session on its network.
      AUTH_INTERNAL_URL: ${AUTH_INTERNAL_URL:-http://shared-auth-api:3110}
      # shared-ai's public key; /internal/tools is served only when it is set (project-standards docs/ai-tools.md).
      AI_TOOLS_PUBLIC_KEY: ${AI_TOOLS_PUBLIC_KEY:-}
    networks:
      default: {}
      shared-auth: {}
      # shared-ai reads this app's tools at http://dev-career-portfolio-api:3108/internal/tools (ADR-0017).
      shared-ai: { aliases: [dev-career-portfolio-api] }
    depends_on:
      db: { condition: service_healthy }
    # The image has no curl, so node asks the API itself. `docker compose up -d --wait` and web depends_on use it (#894).
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3108/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped
  web:
    image: career-frontend:${IMAGE_TAG:-local}
    build: { context: ., dockerfile: frontend/Dockerfile, secrets: [npm_token] }
    # Local default stays 127.0.0.1:8108; the server sets WEB_BIND/WEB_PORT in .env.
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8108}:80']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  dev-career-portfolio-data:
# Created by the shared-auth compose project. Locally, run shared-auth first, or once: docker network create shared-auth
networks:
  shared-auth:
    external: true
  # Created by deploy/remote-deploy.sh or the shared-ai deploy when missing. Locally, once: docker network create shared-ai
  shared-ai:
    name: shared-ai
    external: true
# The Dockerfiles read the GitHub Packages token as a BuildKit secret, so it never lands in an image layer.
secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
